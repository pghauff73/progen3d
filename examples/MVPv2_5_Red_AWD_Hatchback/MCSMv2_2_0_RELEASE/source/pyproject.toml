[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcsmv2-modern-car"
version = "2.2.0"
description = "MCSMv2.2 semantic-surface and concept-kinematics modern-car generator"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-image>=0.22",
  "trimesh>=4.0",
  "Pillow>=10.0",
]
