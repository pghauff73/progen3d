name: CI - build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master, 'codex/lyra-facial-*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libglfw3-dev libgl1-mesa-dev \
            libglm-dev libeigen3-dev libcurl4-openssl-dev libssl-dev libdbus-1-dev \
            libjsoncpp-dev libxml2-dev libx11-dev libxi-dev libxrandr-dev libxext-dev \
            libxrender-dev libxinerama-dev libxcursor-dev
      - name: Build editor and check airflow and procedural facial skin
        run: make -j2 all airflow-check facial-skin-check grammar-time-resampling-check
      - name: Build and check integrated Lyra facial smoke cases
        run: make lyra-facial-check
      - name: Upload Lyra integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyra-facial-integration-diagnostics
          path: |
            build/lyra-facial-integration/fit_manifest.json
            build/lyra-facial-integration/validation.json
            build/lyra-facial-integration/editor_validation.json
          if-no-files-found: ignore
