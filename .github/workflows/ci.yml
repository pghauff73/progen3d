name: CI - build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ripgrep libgl-dev libglfw3-dev libglm-dev \
            libcurl4-openssl-dev libssl-dev libdbus-1-dev libjsoncpp-dev libxml2-dev libeigen3-dev \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev
      - name: Build
        run: make -j2 all progen3d-scene-manifest build/engineering-selection-check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify engineering studies
        run: |
          python3 -m pip install numpy scipy
          python3 -m unittest discover -s tests -p 'test_engineering_studies.py' -v
          python3 -m unittest discover -s tests -p 'test_bonded_coupon.py' -v
          bash tests/run_engineering_native_checks.sh
          ./build/engineering-selection-check
