name: CI - build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ make pkg-config cmake git \
            libgtk-3-dev libglu1-mesa-dev libgl1-mesa-dev libepoxy-dev libglm-dev \
            libopencv-dev libssl-dev libpng-dev libfreetype-dev libpango1.0-dev libatk1.0-dev \
            libatkmm-1.6-dev libpangomm-1.4-dev libsigc++-2.0-dev libglib2.0-dev libgdk-pixbuf2.0-dev libdbus-1-dev \
            libx11-dev libxi-dev libxrandr-dev libxext-dev libxrender-dev libxcursor-dev libxinerama-dev \
            libglfw3-dev libjsoncpp-dev libxml2-dev libeigen3-dev ripgrep
      - name: Build
        run: make -j2 all progen3d-scene-manifest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify engineering studies
        run: |
          python3 -m pip install numpy scipy
          python3 -m unittest discover -s tests -p 'test_engineering_studies.py' -v
          python3 -m unittest discover -s tests -p 'test_bonded_coupon.py' -v
          bash tests/run_engineering_native_checks.sh
