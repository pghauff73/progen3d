name: CI - build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ripgrep libgl-dev libglfw3-dev libglm-dev \
            libcurl4-openssl-dev libssl-dev libdbus-1-dev libjsoncpp-dev libxml2-dev libeigen3-dev \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dri xvfb xauth
      - name: Build and verify engineering devices
        run: make -j2 all check-engineering-devices
      - name: Exercise desktop device playback
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
        run: |
          timeout 100s xvfb-run -a ./progen3d-editor-gui --temporal-smoke-test \
            --open examples/EngineeringDevices/RecentEngineeringDevices.p3d
