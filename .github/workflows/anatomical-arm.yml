name: Anatomical arm Python regression
on:
  push:
    paths:
      - 'examples/AnatomicalArm/**'
      - '.github/workflows/anatomical-arm.yml'
  pull_request:
    paths:
      - 'examples/AnatomicalArm/**'
      - '.github/workflows/anatomical-arm.yml'
  workflow_dispatch:
jobs:
  anatomical-arm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all anatomical-arm modules
        run: python -m compileall -q examples/AnatomicalArm
      - name: Run full anatomical-arm tests
        run: python -m unittest discover -s examples/AnatomicalArm -p 'test_*.py' -v
      - name: Verify mesh quality at six elbow angles
        run: |
          PYTHONPATH=examples/AnatomicalArm python - <<'PY'
          from arm_soft_sleeve import assembly
          from mesh_diagnostics import inspect_assembly
          for angle in (0,30,60,90,120,145):
              result=inspect_assembly(assembly(angle))
              assert result['passed'], (angle,result)
              print('mesh quality',angle,'PASS')
          PY
      - name: Validate six-pose static geometry
        run: python examples/AnatomicalArm/validate_sequence.py --out build/anatomical-arm
      - name: Validate six-pose skin and sleeve geometry
        run: python examples/AnatomicalArm/arm_soft_sleeve.py --out build/anatomical-arm-sleeve
      - name: Run short continuous animation
        run: python examples/AnatomicalArm/coupled_animation.py --out build/arm-coupled --frames 3 --fps 30 --contact radial
      - name: Run triangle-contact integration smoke test
        run: python examples/AnatomicalArm/coupled_animation.py --out build/arm-triangle --frames 2 --fps 30 --contact triangle --friction 0.15
      - name: Validate JSON reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('build/anatomical-arm/validation.json', 'build/anatomical-arm-sleeve/validation.json', 'build/arm-coupled/simulation.json', 'build/arm-triangle/simulation.json'):
              report=json.loads(Path(name).read_text())
              assert report['passed'], (name, report)
              print(name, 'PASS')
          PY
      - name: Validate four-substep elbow animation
        run: python examples/AnatomicalArm/coupled_animation.py --out build/arm-substeps --frames 3 --fps 30 --substeps 4
      - name: Audit deterministic arm motion
        run: python examples/AnatomicalArm/regression_audit.py --out build/arm-regression.json --frames 6
      - name: Benchmark real solver substep configurations
        run: python examples/AnatomicalArm/substep_benchmark.py --out build/arm-substep-benchmark --frames 6
      - name: Select physics substeps from measured results
        run: python examples/AnatomicalArm/select_substeps.py build/arm-substep-benchmark/benchmark.json --out build/arm-substep-selection.json
      - name: Upload diagnostics on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anatomical-arm-diagnostics
          path: |
            build/anatomical-arm/validation.json
            build/anatomical-arm-sleeve/validation.json
            build/arm-coupled/simulation.json
            build/arm-triangle/simulation.json
            build/arm-regression.json
            build/arm-substeps/simulation.json
            build/arm-substep-benchmark/benchmark.json
            build/arm-substep-benchmark/benchmark.csv
            build/arm-substep-selection.json
          if-no-files-found: ignore
